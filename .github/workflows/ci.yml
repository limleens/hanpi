name: Hanpi CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Gradio UI smoke test
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import app
          ui = app.build_app()
          print("Hanpi initialized with", len(ui.fns), "events")
          PY
